<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#f5f5f5">
    <link rel="icon" type="image/png" href="./icons/icon-32.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brain Wars">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="pwa.js" defer></script>
    <style>
        /* Boot loader: painted before the deferred scripts run, faded out when the page is ready */
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            transition: opacity 0.25s ease;
        }
        #boot-loader.is-done {
            opacity: 0;
            pointer-events: none;
        }
        #boot-loader::after {
            content: '';
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(0, 0, 0, 0.12);
            border-top-color: #4d8a98;
            animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-loader::after { animation-duration: 2.4s; }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('boot-loader');
            if (!loader) return;
            loader.classList.add('is-done');
            setTimeout(() => loader.remove(), 400);
        });
    </script>
    <title>Умножение в столбик</title>
    <script src="i18n.js" defer></script>
    <script src="games.js" defer></script>
    <script src="analytics.js" defer></script>
    <script src="column-game.js" defer></script>
  <script src="challenge.js" defer></script>
  <link rel="stylesheet" href="./column-game.css">
</head>
<body>
    <div id="boot-loader" aria-hidden="true"></div>

    <!-- Top Navigation -->
    <header class="top-nav">
        <a id="backBtn" class="nav-btn icon-btn" href="./index.html" data-i18n-aria-label="nav_back" aria-label="Назад к играм"><svg class="back-arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M20 12H6M11.5 6 5.5 12 11.5 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <div data-lang-toggle></div>
        <div class="level-picker">
            <button type="button" id="levelDisplay" class="level-badge" aria-haspopup="listbox" aria-expanded="false">
                <span id="levelText" aria-live="polite">Уровень 1</span>
                <span class="level-caret" aria-hidden="true">▾</span>
            </button>
            <div class="level-menu" id="levelMenu" role="listbox" data-i18n-aria-label="lm_level_menu_aria" aria-label="Выберите уровень"></div>
        </div>
    </header>

    <!-- Main Game Card -->
    <main class="game-card">
        <!-- Step instruction banner -->
        <div class="instruction-box" id="instructionBox" role="status" aria-live="polite">
            <div class="instruction-hint" id="instructionHint"></div>
        </div>

        <!-- Terminology Tags / Quick reminder -->
        <div class="terms-strip">
            <span class="term-badge multiplicand" data-term="multiplicand" data-i18n="lm_term_multiplicand" data-i18n-title="lm_term_multiplicand_title" title="Число, которое умножаем">Множимое</span>
            <span class="term-badge multiplier" data-term="multiplier" data-i18n="lm_term_multiplier" data-i18n-title="lm_term_multiplier_title" title="Число, на которое умножаем">Множитель</span>
            <span class="term-badge product" data-term="product" data-i18n="lm_term_product" data-i18n-title="lm_term_product_title" title="Результат умножения">Произведение</span>
            <span class="term-badge partial" data-term="partial" data-i18n="lm_term_partial" data-i18n-title="lm_term_partial_title" title="Строка произведения для одной цифры множителя">Неполное произведение</span>
        </div>

        <!-- Math Notebook Grid Board -->
        <div class="board-container">
            <div class="grid-wrapper" id="gridWrapper">
                <div class="math-grid" id="mathGrid">
                    <!-- Dynamically generated squared cells -->
                </div>
                <!-- Decimal separators drawn on cell borders -->
                <div class="comma-layer" id="commaLayer"></div>
            </div>
        </div>

        <!-- Touch Numpad -->
        <div class="numpad-grid" id="numpadGrid" role="group" data-i18n-aria-label="lm_numpad_aria" aria-label="Цифровая клавиатура">
            <button type="button" class="numpad-btn" data-key="1">1</button>
            <button type="button" class="numpad-btn" data-key="2">2</button>
            <button type="button" class="numpad-btn" data-key="3">3</button>
            <button type="button" class="numpad-btn" data-key="4">4</button>
            <button type="button" class="numpad-btn" data-key="5">5</button>
            <button type="button" class="numpad-btn" data-key="6">6</button>
            <button type="button" class="numpad-btn" data-key="7">7</button>
            <button type="button" class="numpad-btn" data-key="8">8</button>
            <button type="button" class="numpad-btn" data-key="9">9</button>
            <button type="button" class="numpad-btn" data-key="0">0</button>
        </div>

        <!-- Custom equation CTA -->
        <button type="button" class="custom-eq-btn" id="customEqBtn" data-i18n="lm_custom_btn">✏️ Своё выражение</button>
    </main>

    <!-- Custom Equation Modal -->
    <div class="modal-backdrop" id="customModal" role="dialog" aria-modal="true" aria-labelledby="customModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="customModalTitle" data-i18n="lm_custom_title">Своё выражение</div>
                <button type="button" class="modal-close-btn" id="customCloseBtn" data-i18n-aria-label="lm_custom_close_aria" aria-label="Закрыть окно">&times;</button>
            </div>
            <div class="modal-body">
                <form class="custom-form" id="customForm" novalidate>
                    <div class="custom-field">
                        <label for="customFactor1" data-i18n="lm_custom_factor1">Первый множитель</label>
                        <input id="customFactor1" name="factor1" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="123">
                    </div>
                    <div class="custom-field">
                        <label for="customFactor2" data-i18n="lm_custom_factor2">Второй множитель</label>
                        <input id="customFactor2" name="factor2" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="45">
                    </div>
                    <div class="custom-error" id="customError" role="alert"></div>
                    <div class="custom-actions">
                        <button type="submit" class="custom-solve-btn" data-i18n="lm_custom_solve">Решить</button>
                        <button type="button" class="custom-cancel-btn" id="customCancelBtn" data-i18n="lm_custom_cancel">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Completion Overlay -->
    <div class="completion-overlay" id="completionOverlay" role="dialog" aria-modal="true">
        <div class="completion-icon">🌟</div>
        <div class="completion-title" data-i18n="lm_done_title">Отлично решено!</div>
        <div class="completion-equation" id="completionEquation">24 × 3 = 72</div>
        <button type="button" class="completion-next-btn" id="nextProblemBtn" data-i18n="lm_done_next">Следующий пример →</button>
    </div>

    <!-- Game Engine -->
    <script>
        class LongMultiplicationGame {
            #state;
            #elements;
            #config;

            constructor() {
                this.#initConfig();
                this.#initElements();
                this.#initState();
                this.#bindEvents();
                this.#subscribeToLanguageChanges();
                this.#startNewRound();
            }

            // The context the shared column-game functions work on: this page's
            // elements, state and config, plus the methods only this game has.
            #ctx() {
                return {
                    elements: this.#elements,
                    state: this.#state,
                    config: this.#config,
                    hooks: {
                        initConfig: () => this.#initConfig(),
                        initState: () => this.#initState(),
                        beginRound: (problem, isCustom) => this.#beginRound(problem, isCustom),
                        createProblem: (level) => this.#createProblem(level),
                        promptCurrentStep: () => this.#promptCurrentStep(),
                        renderCommas: () => this.#renderCommas(),
                        renderCompletionEquation: () => this.#renderCompletionEquation(),
                        handleCorrectInput: () => this.#handleCorrectInput(),
                        handleWrongInput: () => this.#handleWrongInput(),
                        highlightTerm: (term) => this.#highlightTerm(term),
                        toggleCustomModal: (open) => this.#toggleCustomModal(open),
                        submitCustomProblem: () => this.#submitCustomProblem(),
                    }
                };
            }

            #initConfig() {
                this.#config = {
                    maxLevel: 20,
                    maxProductDigits: 8,
                    // The notebook grid never uses more than this many columns: with
                    // more the cells and digits get too small to read on a phone.
                    maxGridColumns: 12
                };
            }

            #initElements() {
                this.#elements = BrainWarsColumnGame.initElements();
            }

            #initState() {
                this.#state = {
                    level: 1,
                    isCustomRound: false,
                    hadErrorThisRound: false,
                    multiplicandDigits: '24',
                    multiplicandDecimals: 0,
                    multiplierDigits: '3',
                    multiplierDecimals: 0,
                    productDigits: '72',
                    productDecimals: 0,
                    steps: [],
                    stepIndex: 0,
                    partialRows: [],
                    partialLengths: [],
                    currentInput: '',
                    expectedAnswer: '',
                    gridMatrix: [],
                    numRows: 0,
                    numCols: 0,
                    baseCol: 0,
                    resultRow: 0,
                    activeTargetCells: []
                };
            }

            #bindEvents() {
                // Numpad clicks
                this.#elements.numpadGrid.addEventListener('click', (e) => {
                    const btn = e.target.closest('.numpad-btn');
                    if (!btn) return;
                    this.#handleKeyPress(btn.dataset.key);
                });

                // Physical keyboard support
                window.addEventListener('keydown', (e) => {
                    if (this.#elements.customModal.classList.contains('open')) {
                        if (e.key === 'Escape') this.#toggleCustomModal(false);
                        return;
                    }
                    if (this.#elements.levelMenu.classList.contains('open')) {
                        if (e.key === 'Escape') {
                            this.#toggleLevelMenu(false);
                            this.#elements.levelDisplay.focus();
                        }
                        return;
                    }
                    if (this.#elements.completionOverlay.classList.contains('show')) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            this.#startNewRound();
                        }
                        return;
                    }

                    const isControlFocused = e.target instanceof HTMLElement &&
                        (e.target.tagName === 'BUTTON' || e.target.tagName === 'A');
                    if (isControlFocused && (e.key === 'Enter' || e.key === ' ')) {
                        return; // Let the focused control handle its own activation
                    }

                    if (e.key >= '0' && e.key <= '9') {
                        this.#handleKeyPress(e.key);
                    } else if (e.key === 'Backspace') {
                        this.#handleKeyPress('backspace');
                    } else if (e.key === 'Enter') {
                        this.#handleKeyPress('enter');
                    }
                });

                // Terminology badge interactive highlights
                document.querySelectorAll('.term-badge').forEach(badge => {
                    badge.addEventListener('click', () => {
                        this.#highlightTerm(badge.dataset.term);
                    });
                });

                // Window resize for comma alignment
                window.addEventListener('resize', () => {
                    this.#applyCellSize();
                    this.#renderCommas();
                });


                // Completion next button
                this.#elements.nextProblemBtn.addEventListener('click', () => this.#startNewRound());

                // Custom equation modal
                this.#elements.customEqBtn.addEventListener('click', () => this.#toggleCustomModal(true));
                this.#elements.customCloseBtn.addEventListener('click', () => this.#toggleCustomModal(false));
                this.#elements.customCancelBtn.addEventListener('click', () => this.#toggleCustomModal(false));
                this.#elements.customModal.addEventListener('click', (e) => {
                    if (e.target === this.#elements.customModal) this.#toggleCustomModal(false);
                });
                this.#elements.customForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.#submitCustomProblem();
                });

                // Level picker
                this.#elements.levelDisplay.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.#toggleLevelMenu();
                });
                this.#elements.levelMenu.addEventListener('click', (e) => {
                    const item = e.target.closest('.level-menu-item');
                    if (!item) return;
                    e.stopPropagation();
                    this.#selectLevel(Number(item.dataset.level));
                });
                this.#elements.levelMenu.addEventListener('keydown', (e) => {
                    const items = Array.from(this.#elements.levelMenu.querySelectorAll('.level-menu-item'));
                    const index = items.indexOf(document.activeElement);
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        const next = items[Math.min(items.length - 1, index + 1)];
                        if (next) next.focus();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        const prev = items[Math.max(0, index - 1)];
                        if (prev) prev.focus();
                    } else if (e.key === 'Home') {
                        e.preventDefault();
                        items[0].focus();
                    } else if (e.key === 'End') {
                        e.preventDefault();
                        items[items.length - 1].focus();
                    }
                });
                document.addEventListener('click', (e) => {
                    if (!this.#elements.levelMenu.classList.contains('open')) return;
                    if (e.target.closest('.level-picker')) return;
                    this.#toggleLevelMenu(false);
                });
            }

            #subscribeToLanguageChanges() {
                I18n.subscribe(() => this.#handleLanguageChange());
            }

            #handleLanguageChange() {
                this.#renderLevelBadge();
                if (this.#elements.levelMenu.classList.contains('open')) {
                    this.#renderLevelMenu();
                }
                this.#renderCommas();
                this.#renderCompletionEquation();
                if (!this.#elements.completionOverlay.classList.contains('show')) {
                    this.#promptCurrentStep();
                }
            }

            // ---------------------------------------------------------------
            // Problem generation
            // ---------------------------------------------------------------

            #randomInt(min, max) {
                return BrainWarsColumnGame.randomInt(min, max);
            }

            #randomDigits(length, big) {
                let digits = '';
                for (let i = 0; i < length; i++) {
                    const min = big ? 4 : (i === 0 ? 1 : 0);
                    digits += String(this.#randomInt(min, 9));
                }
                return digits;
            }

            #hasCarry(multiplicand, multiplier) {
                for (let j = 0; j < multiplier.length; j++) {
                    const b = Number(multiplier[multiplier.length - 1 - j]);
                    for (let i = 0; i < multiplicand.length; i++) {
                        const a = Number(multiplicand[multiplicand.length - 1 - i]);
                        if (a * b >= 10) return true;
                    }
                }
                return false;
            }

            // Difficulty grows with digit counts, then with decimals on one
            // factor (levels 11-15) and on both factors (levels 16-20).
            #getLevelConfig(level) {
                const table = [
                    { mMin: 2, mMax: 2, nMin: 1, nMax: 1, noCarry: true },
                    { mMin: 2, mMax: 2, nMin: 1, nMax: 1 },
                    { mMin: 3, mMax: 3, nMin: 1, nMax: 1 },
                    { mMin: 2, mMax: 2, nMin: 2, nMax: 2 },
                    { mMin: 3, mMax: 3, nMin: 2, nMax: 2 },
                    { mMin: 3, mMax: 3, nMin: 2, nMax: 2, bigDigits: true },
                    { mMin: 4, mMax: 4, nMin: 2, nMax: 2 },
                    { mMin: 3, mMax: 3, nMin: 3, nMax: 3 },
                    { mMin: 4, mMax: 4, nMin: 3, nMax: 3 },
                    { mMin: 4, mMax: 4, nMin: 3, nMax: 3, bigDigits: true },
                    { mMin: 3, mMax: 3, nMin: 2, nMax: 2, k1: 1 },
                    { mMin: 3, mMax: 3, nMin: 2, nMax: 2, k2: 1 },
                    { mMin: 4, mMax: 4, nMin: 2, nMax: 2, k1: 1 },
                    { mMin: 3, mMax: 3, nMin: 3, nMax: 3, k1: 1 },
                    { mMin: 4, mMax: 4, nMin: 3, nMax: 3, k1: 1 },
                    { mMin: 3, mMax: 3, nMin: 2, nMax: 2, k1: 1, k2: 1 },
                    { mMin: 4, mMax: 4, nMin: 2, nMax: 2, k1: 1, k2: 1 },
                    { mMin: 3, mMax: 3, nMin: 3, nMax: 3, k1: 1, k2: 1 },
                    { mMin: 4, mMax: 4, nMin: 3, nMax: 3, k1: 1, k2: 1 },
                    { mMin: 4, mMax: 4, nMin: 3, nMax: 3, k1: 2, k2: 1 }
                ];
                const index = Math.min(Math.max(level, 1), table.length) - 1;
                return table[index];
            }

            #createProblem(level) {
                const cfg = this.#getLevelConfig(level);

                for (let attempt = 0; attempt < 600; attempt++) {
                    let m = this.#randomInt(cfg.mMin, cfg.mMax);
                    let n = this.#randomInt(cfg.nMin, cfg.nMax);
                    if (n > m) {
                        const swap = m;
                        m = n;
                        n = swap;
                    }

                    const k1 = cfg.k1 || 0;
                    const k2 = cfg.k2 || 0;
                    const multiplicand = this.#randomDigits(m, cfg.bigDigits);
                    const multiplier = this.#randomDigits(n, cfg.bigDigits);

                    const product = String(Number(multiplicand) * Number(multiplier));
                    if (product.length > this.#config.maxProductDigits) continue;
                    // Keep the notebook grid inside the column budget, otherwise the
                    // cells get too small to read on a phone.
                    if (this.#geometry(multiplicand, k1, multiplier, k2).numCols > this.#config.maxGridColumns) continue;
                    if (cfg.noCarry && this.#hasCarry(multiplicand, multiplier)) continue;
                    if (n >= 2 && multiplier[multiplier.length - 1] === '0') continue;
                    if (k1 > 0 && multiplicand[multiplicand.length - 1] === '0') continue;
                    if (k2 > 0 && multiplier[multiplier.length - 1] === '0') continue;

                    return {
                        multiplicandDigits: multiplicand,
                        multiplicandDecimals: k1,
                        multiplierDigits: multiplier,
                        multiplierDecimals: k2
                    };
                }

                return { multiplicandDigits: '24', multiplicandDecimals: 0, multiplierDigits: '3', multiplierDecimals: 0 };
            }

            // ---------------------------------------------------------------
            // Round setup
            // ---------------------------------------------------------------

            #startNewRound() {
                this.#beginRound(this.#createProblem(this.#state.level), false);
            }

            #beginRound(problem, isCustomRound) {
                this.#elements.completionOverlay.classList.remove('show');
                this.#state.isCustomRound = !!isCustomRound;
                this.#state.hadErrorThisRound = false;
                this.#state.currentInput = '';
                this.#state.multiplicandDigits = problem.multiplicandDigits;
                this.#state.multiplicandDecimals = problem.multiplicandDecimals;
                this.#state.multiplierDigits = problem.multiplierDigits;
                this.#state.multiplierDecimals = problem.multiplierDecimals;

                this.#renderLevelBadge();
                this.#computeGeometry();
                this.#computePlan();
                this.#buildGrid();
                this.#renderCommas();

                this.#state.stepIndex = 0;
                this.#promptCurrentStep();
            }

            // Sign gutter + the widest row (a shifted partial product or the product
            // itself). Every number is right-aligned on baseCol and the factor decimals
            // live inside the digit block, so no trailing columns are reserved.
            #geometry(multiplicandDigits, multiplicandDecimals, multiplierDigits, multiplierDecimals) {
                const m = multiplicandDigits.length;
                const n = multiplierDigits.length;
                const productDigits = String(Number(multiplicandDigits) * Number(multiplierDigits));
                const leftUnits = Math.max(m, n + m - 1, productDigits.length);

                // Column 0 is the single sign/carry gutter: every number is right
                // aligned on baseCol, so the content needs baseCol + 1 columns.
                return {
                    productDigits,
                    productDecimals: multiplicandDecimals + multiplierDecimals,
                    baseCol: leftUnits,
                    numCols: leftUnits + 1
                };
            }

            #computeGeometry() {
                const s = this.#state;
                const n = s.multiplierDigits.length;
                const geometry = this.#geometry(
                    s.multiplicandDigits, s.multiplicandDecimals,
                    s.multiplierDigits, s.multiplierDecimals
                );

                s.productDigits = geometry.productDigits;
                s.productDecimals = geometry.productDecimals;
                s.baseCol = geometry.baseCol;
                s.numCols = geometry.numCols;

                if (n === 1) {
                    // A single-digit multiplier: the partial product IS the
                    // product, so there is no separate addition phase.
                    s.numRows = 3;
                    s.resultRow = 2;
                } else {
                    // Operands, one row per multiplier digit, then the result. The line
                    // above the result is the bottom border of the last partial row.
                    s.numRows = 3 + n;
                    s.resultRow = 2 + n;
                }
            }

            #computePlan() {
                const s = this.#state;
                const ad = Array.from(s.multiplicandDigits).map(Number);
                const bd = Array.from(s.multiplierDigits).map(Number);
                const m = ad.length;
                const n = bd.length;
                const steps = [];
                const partialDigits = [];
                const partialLengths = [];

                // Partial products, one row per multiplier digit (right to left)
                for (let j = 0; j < n; j++) {
                    const b = bd[n - 1 - j];
                    const row = 2 + j;
                    const digits = [];
                    let carry = 0;

                    for (let i = 0; i < m; i++) {
                        const a = ad[m - 1 - i];
                        const carryBefore = carry;
                        const value = a * b + carryBefore;
                        const writeDigit = value % 10;
                        carry = Math.floor(value / 10);
                        digits.push(writeDigit);
                        steps.push({
                            type: 'MUL',
                            a,
                            b,
                            carryBefore,
                            expected: value,
                            writeDigit,
                            row,
                            col: s.baseCol - j - i,
                            badge: carry > 0 ? { row: row - 1, col: s.baseCol - j - i - 1 } : null,
                            carryAfter: carry
                        });
                    }

                    if (carry > 0) {
                        digits.push(carry);
                        steps.push({
                            type: 'CARRY',
                            expected: carry,
                            writeDigit: carry,
                            row,
                            col: s.baseCol - j - m,
                            badge: null,
                            carryAfter: 0
                        });
                    }

                    partialDigits.push(digits);
                    partialLengths.push(digits.length);
                }

                // Column addition of the partial products (only when the
                // multiplier has more than one digit)
                if (n > 1) {
                    const L = s.productDigits.length;
                    let carry = 0;

                    for (let c = 0; c < L; c++) {
                        const addends = [];
                        for (let j = 0; j < n; j++) {
                            const index = c - j;
                            if (index >= 0 && index < partialLengths[j]) {
                                addends.push(partialDigits[j][index]);
                            }
                        }
                        const carryBefore = carry;
                        const value = addends.reduce((sum, digit) => sum + digit, 0) + carryBefore;
                        const writeDigit = value % 10;
                        carry = Math.floor(value / 10);
                        steps.push({
                            type: 'ADD',
                            addends,
                            carryBefore,
                            expected: value,
                            writeDigit,
                            row: s.resultRow,
                            col: s.baseCol - c,
                            badge: carry > 0 ? { row: s.resultRow - 1, col: s.baseCol - c - 1 } : null,
                            carryAfter: carry
                        });
                    }
                }

                s.steps = steps;
                s.partialLengths = partialLengths;
            }

            // ---------------------------------------------------------------
            // Grid
            // ---------------------------------------------------------------

            #buildGrid() {
                const s = this.#state;
                const m = s.multiplicandDigits.length;
                const n = s.multiplierDigits.length;
                const k1 = s.multiplicandDecimals;
                const k2 = s.multiplierDecimals;
                const L = s.productDigits.length;

                const matrix = [];
                for (let r = 0; r < s.numRows; r++) {
                    const row = [];
                    for (let c = 0; c < s.numCols; c++) {
                        row.push({ char: '', classes: [] });
                    }
                    matrix.push(row);
                }

                // Factors
                for (let i = 0; i < m; i++) {
                    matrix[0][s.baseCol - i].char = s.multiplicandDigits[m - 1 - i];
                }
                for (let j = 0; j < n; j++) {
                    matrix[1][s.baseCol - j].char = s.multiplierDigits[n - 1 - j];
                }
                matrix[1][s.baseCol - Math.max(m, n)].char = '×';
                matrix[1][s.baseCol - Math.max(m, n)].classes.push('operator-sign');

                // Line under the factors, clamped to the grid
                const factorRight = Math.min(s.baseCol + Math.max(k1, k2), s.numCols - 1);
                for (let c = s.baseCol - Math.max(m, n) + 1; c <= factorRight; c++) {
                    matrix[1][c].classes.push('subtraction-line');
                }

                // Line above the result (spans the partial products and the result)
                if (n > 1) {
                    let leftExtent = s.baseCol - (L - 1);
                    for (let j = 0; j < n; j++) {
                        leftExtent = Math.min(leftExtent, s.baseCol - j - (s.partialLengths[j] - 1));
                    }
                    const lineRow = s.resultRow - 1;
                    for (let c = leftExtent; c <= Math.min(s.baseCol + s.productDecimals, s.numCols - 1); c++) {
                        matrix[lineRow][c].classes.push('subtraction-line');
                    }
                }

                s.gridMatrix = matrix;
                this.#renderGridDOM();
            }

            #renderGridDOM() {
                const grid = this.#elements.mathGrid;
                grid.innerHTML = '';

                this.#applyCellSize();

                grid.style.gridTemplateColumns = `repeat(${this.#state.numCols}, var(--cell-size))`;
                grid.style.gridTemplateRows = `repeat(${this.#state.numRows}, var(--cell-size))`;

                for (let r = 0; r < this.#state.numRows; r++) {
                    for (let c = 0; c < this.#state.numCols; c++) {
                        const cellData = this.#state.gridMatrix[r][c];
                        const cellEl = document.createElement('div');
                        cellEl.className = 'grid-cell ' + cellData.classes.join(' ');
                        cellEl.id = `cell-${r}-${c}`;
                        cellEl.textContent = cellData.char;
                        grid.appendChild(cellEl);
                    }
                }
            }

            // The notebook grid is the main content, so cells grow to fill the free
            // width. They only shrink (down to a readable floor) when a long problem
            // needs more columns than fit on screen.
            #applyCellSize() {
                BrainWarsColumnGame.applyCellSize(this.#elements, this.#state);
            }

            #renderCommas() {
                const layer = this.#elements.commaLayer;
                layer.innerHTML = '';
                if (!this.#state.productDecimals && !this.#state.multiplicandDecimals && !this.#state.multiplierDecimals) return;

                const grid = this.#elements.mathGrid;
                const gridRect = grid.getBoundingClientRect();
                const separator = I18n.t('decimal_separator');

                const place = (row, decimals) => {
                    if (!decimals) return;
                    const cell = document.getElementById(`cell-${row}-${this.#state.baseCol - decimals + 1}`);
                    if (!cell) return;
                    const rect = cell.getBoundingClientRect();
                    const span = document.createElement('span');
                    span.className = 'comma-overlay';
                    span.textContent = separator;
                    span.style.left = (rect.left - gridRect.left) + 'px';
                    span.style.top = (rect.top - gridRect.top) + 'px';
                    span.style.height = rect.height + 'px';
                    layer.appendChild(span);
                };

                place(0, this.#state.multiplicandDecimals);
                place(1, this.#state.multiplierDecimals);
                place(this.#state.resultRow, this.#state.productDecimals);
            }

            // ---------------------------------------------------------------
            // Prompting and input
            // ---------------------------------------------------------------

            #promptCurrentStep() {
                const step = this.#state.steps[this.#state.stepIndex];
                if (!step) return;

                this.#state.currentInput = '';
                this.#state.expectedAnswer = String(step.expected);
                this.#elements.instructionHint.classList.remove('is-error');
                this.#syncActiveCell();

                if (step.type === 'MUL') {
                    this.#elements.instructionHint.textContent = step.carryBefore > 0
                        ? I18n.t('lm_mul_hint_carry', { a: step.a, b: step.b, carry: step.carryBefore })
                        : I18n.t('lm_mul_hint', { a: step.a, b: step.b });
                } else if (step.type === 'CARRY') {
                    this.#elements.instructionHint.textContent = I18n.t('lm_carry_hint', { carry: step.expected });
                } else {
                    const terms = step.addends.join(' + ');
                    const expression = step.carryBefore > 0 ? `${terms} + ${step.carryBefore}` : terms;
                    this.#elements.instructionHint.textContent = I18n.t('lm_add_hint', { expr: expression });
                }
            }

            #syncActiveCell() {
                const step = this.#state.steps[this.#state.stepIndex];
                const previous = this.#state.activeTargetCells;
                previous.forEach(({ r, c }) => {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (cell) {
                        cell.classList.remove('active-input', 'typing-preview', 'multi');
                        cell.textContent = this.#state.gridMatrix[r][c].char;
                    }
                });

                this.#state.activeTargetCells = [{ r: step.row, c: step.col }];
                const cell = document.getElementById(`cell-${step.row}-${step.col}`);
                if (cell) {
                    cell.classList.add('active-input');
                    this.#scrollCellIntoView(cell);
                }
            }

            #scrollCellIntoView(cell) {
                BrainWarsColumnGame.scrollCellIntoView(cell, this.#elements);
            }

            #handleKeyPress(key) {
                if (key === 'backspace') {
                    this.#state.currentInput = this.#state.currentInput.slice(0, -1);
                    this.#renderTypingPreview();
                    return;
                }

                if (key === 'enter') {
                    this.#submitCurrentInput();
                    return;
                }

                if (key >= '0' && key <= '9') {
                    if (this.#state.currentInput.length >= this.#state.expectedAnswer.length) return;
                    this.#elements.instructionHint.classList.remove('is-error');
                    this.#state.currentInput += key;
                    this.#renderTypingPreview();

                    if (this.#state.currentInput.length === this.#state.expectedAnswer.length) {
                        setTimeout(() => this.#submitCurrentInput(), 80);
                    }
                }
            }

            #renderTypingPreview() {
                BrainWarsColumnGame.renderTypingPreview(this.#state);
            }

            #submitCurrentInput() {
                const userVal = this.#state.currentInput.trim();
                if (!userVal) return;

                if (userVal === this.#state.expectedAnswer) {
                    this.#handleCorrectInput();
                } else {
                    this.#handleWrongInput();
                }
            }

            #handleCorrectInput() {
                const step = this.#state.steps[this.#state.stepIndex];

                this.#setCellValue(step.row, step.col, String(step.writeDigit), ['correct-flash']);
                this.#clearCarryBadges();
                if (step.badge) {
                    this.#setCarryBadge(step.badge.row, step.badge.col, step.carryAfter);
                }

                this.#state.stepIndex++;
                if (this.#state.stepIndex < this.#state.steps.length) {
                    this.#promptCurrentStep();
                } else {
                    this.#finishRound();
                }
            }

            #handleWrongInput() {
                this.#state.hadErrorThisRound = true;

                this.#state.activeTargetCells.forEach(({ r, c }) => {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (!cell) return;
                    cell.classList.add('error-shake');
                    setTimeout(() => cell.classList.remove('error-shake'), 600);
                });

                this.#elements.instructionHint.classList.add('is-error');
                this.#elements.instructionHint.textContent = I18n.t('lm_wrong_hint');

                setTimeout(() => {
                    this.#elements.instructionHint.classList.remove('is-error');
                }, 1200);

                this.#state.currentInput = '';
                this.#renderTypingPreview();
            }

            #setCellValue(r, c, char, additionalClasses = []) {
                BrainWarsColumnGame.setCellValue(r, c, char, additionalClasses, this.#state);
            }

            #setCarryBadge(r, c, value) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                if (!cell) return;
                const badge = document.createElement('span');
                badge.className = 'carry-badge';
                badge.textContent = '+' + value;
                cell.appendChild(badge);
            }

            #clearCarryBadges() {
                document.querySelectorAll('.carry-badge').forEach(badge => badge.remove());
            }

            // ---------------------------------------------------------------
            // Terminology highlights
            // ---------------------------------------------------------------

            // Paint every element `collect` returns, then drop the paint again.
            #paint(cls, collect) {
                BrainWarsColumnGame.paint(cls, collect);
            }

            #digitCells(row, digits) {
                const cells = [];
                for (let i = 0; i < digits.length; i++) {
                    cells.push(document.getElementById(`cell-${row}-${this.#state.baseCol - i}`));
                }
                return cells.filter(Boolean);
            }

            #partialCells() {
                const step = this.#state.steps[Math.min(this.#state.stepIndex, this.#state.steps.length - 1)];
                if (!step) return [];
                const singleDigitMultiplier = this.#state.multiplierDigits.length === 1;
                const partialRow = singleDigitMultiplier
                    ? this.#state.resultRow
                    : (step.row < this.#state.resultRow ? step.row : this.#state.resultRow - 1);
                const cells = [];
                for (let c = 0; c < this.#state.numCols; c++) {
                    const cell = document.getElementById(`cell-${partialRow}-${c}`);
                    if (cell && cell.textContent) cells.push(cell);
                }
                return cells;
            }

            #highlightTerm(term) {
                const state = this.#state;
                if (term === 'multiplicand') return this.#paint('term-highlight-blue', () => this.#digitCells(0, state.multiplicandDigits));
                if (term === 'multiplier') return this.#paint('term-highlight-amber', () => this.#digitCells(1, state.multiplierDigits));
                if (term === 'product') return this.#paint('term-highlight-green', () => this.#digitCells(state.resultRow, state.productDigits));
                if (term === 'partial') return this.#paint('term-highlight-purple', () => this.#partialCells());
            }

            // ---------------------------------------------------------------
            // Round completion
            // ---------------------------------------------------------------

            #formatNumberText(digits, decimals) {
                return BrainWarsColumnGame.formatNumberText(digits, decimals);
            }

            #renderCompletionEquation() {
                this.#elements.completionEquation.textContent =
                    `${this.#formatNumberText(this.#state.multiplicandDigits, this.#state.multiplicandDecimals)}` +
                    ` × ${this.#formatNumberText(this.#state.multiplierDigits, this.#state.multiplierDecimals)}` +
                    ` = ${this.#formatNumberText(this.#state.productDigits, this.#state.productDecimals)}`;
            }

            #finishRound() {
                this.#state.activeTargetCells = [];
                this.#clearCarryBadges();

                // Custom equations don't affect the level progression
                if (!this.#state.isCustomRound) {
                    if (this.#state.hadErrorThisRound) {
                        this.#state.level = Math.max(1, this.#state.level - 1);
                    } else {
                        this.#state.level = Math.min(this.#config.maxLevel, this.#state.level + 1);
                    }
                }

                this.#renderCompletionEquation();

                setTimeout(() => {
                    this.#elements.completionOverlay.classList.add('show');
                }, 400);
            }

            // ---------------------------------------------------------------
            // Level picker
            // ---------------------------------------------------------------

            #renderLevelBadge() {
                BrainWarsColumnGame.renderLevelBadge(this.#elements, this.#state);
            }

            #renderLevelMenu() {
                BrainWarsColumnGame.renderLevelMenu(this.#elements, this.#state, this.#config);
            }

            #toggleLevelMenu(open) {
                const menu = this.#elements.levelMenu;
                const willOpen = (open !== undefined) ? open : !menu.classList.contains('open');
                menu.classList.toggle('open', willOpen);
                this.#elements.levelDisplay.setAttribute('aria-expanded', willOpen ? 'true' : 'false');

                if (willOpen) {
                    this.#renderLevelMenu();
                    this.#positionLevelMenu();
                    const current = menu.querySelector('.level-menu-item.current');
                    if (current) current.focus();
                }
            }

            #positionLevelMenu() {
                BrainWarsColumnGame.positionLevelMenu(this.#elements);
            }

            #selectLevel(level) {
                this.#state.level = Math.min(Math.max(level, 1), this.#config.maxLevel);
                this.#toggleLevelMenu(false);
                this.#startNewRound();
            }

            // ---------------------------------------------------------------
            // Modals
            // ---------------------------------------------------------------


            #toggleCustomModal(open) {
                this.#elements.customModal.classList.toggle('open', open);
                this.#elements.customError.textContent = '';
                if (open) {
                    this.#elements.customFactor1.value =
                        this.#formatNumberText(this.#state.multiplicandDigits, this.#state.multiplicandDecimals);
                    this.#elements.customFactor2.value =
                        this.#formatNumberText(this.#state.multiplierDigits, this.#state.multiplierDecimals);
                    this.#elements.customFactor1.focus();
                    this.#elements.customFactor1.select();
                }
            }

            #showCustomError(key) {
                BrainWarsColumnGame.showCustomError(key, this.#elements);
            }

            #parseFactor(raw) {
                // Accept generous input here: the product and column budgets below
                // decide what can be shown, and they report their own "too big" message.
                const match = String(raw).trim().replace(/\s+/g, '').match(/^(\d{1,12})(?:[.,](\d{1,2}))?$/);
                if (!match || Number(match[1]) < 1) return null;
                let fraction = match[2] || '';
                while (fraction.endsWith('0')) fraction = fraction.slice(0, -1);
                return { digits: match[1] + fraction, decimals: fraction.length };
            }

            #submitCustomProblem() {
                const factor1 = this.#parseFactor(this.#elements.customFactor1.value);
                const factor2 = this.#parseFactor(this.#elements.customFactor2.value);
                if (!factor1 || !factor2) {
                    this.#showCustomError('lm_custom_err_factor');
                    return;
                }

                const product = String(Number(factor1.digits) * Number(factor2.digits));
                if (product.length > this.#config.maxProductDigits || factor1.decimals + factor2.decimals > 4) {
                    this.#showCustomError('lm_custom_err_too_big');
                    return;
                }

                // Same column budget as the generated levels: a longer example would
                // shrink the grid cells until the digits are unreadable.
                if (this.#geometry(factor1.digits, factor1.decimals, factor2.digits, factor2.decimals).numCols > this.#config.maxGridColumns) {
                    this.#showCustomError('lm_custom_err_too_big');
                    return;
                }

                this.#toggleCustomModal(false);
                this.#beginRound({
                    multiplicandDigits: factor1.digits,
                    multiplicandDecimals: factor1.decimals,
                    multiplierDigits: factor2.digits,
                    multiplierDecimals: factor2.decimals
                }, true);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new LongMultiplicationGame();
        });
    </script>
</body>
</html>
