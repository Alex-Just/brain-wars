<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#f5f5f5">
    <link rel="icon" type="image/png" href="./icons/icon-32.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brain Wars">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="pwa.js" defer></script>
    <style>
        /* Boot loader: painted before the deferred scripts run, faded out when the page is ready */
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            transition: opacity 0.25s ease;
        }
        #boot-loader.is-done {
            opacity: 0;
            pointer-events: none;
        }
        #boot-loader::after {
            content: '';
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(0, 0, 0, 0.12);
            border-top-color: #4d8a98;
            animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-loader::after { animation-duration: 2.4s; }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('boot-loader');
            if (!loader) return;
            loader.classList.add('is-done');
            setTimeout(() => loader.remove(), 400);
        });
    </script>
    <title>Сложение в столбик</title>
    <script src="i18n.js" defer></script>
    <script src="games.js" defer></script>
    <script src="analytics.js" defer></script>
    <script src="column-game.js" defer></script>
  <script src="challenge.js" defer></script>
  <link rel="stylesheet" href="./column-game.css">
</head>
<body>
    <div id="boot-loader" aria-hidden="true"></div>

    <!-- Top Navigation -->
    <header class="top-nav">
        <a id="backBtn" class="nav-btn icon-btn" href="./index.html" data-i18n-aria-label="nav_back" aria-label="Назад к играм"><svg class="back-arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M20 12H6M11.5 6 5.5 12 11.5 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <div data-lang-toggle></div>
        <div class="level-picker">
            <button type="button" id="levelDisplay" class="level-badge" aria-haspopup="listbox" aria-expanded="false">
                <span id="levelText" aria-live="polite">Уровень 1</span>
                <span class="level-caret" aria-hidden="true">▾</span>
            </button>
            <div class="level-menu" id="levelMenu" role="listbox" data-i18n-aria-label="la_level_menu_aria" aria-label="Выберите уровень"></div>
        </div>
    </header>

    <!-- Main Game Card -->
    <main class="game-card">
        <!-- Step instruction banner -->
        <div class="instruction-box" id="instructionBox" role="status" aria-live="polite">
            <div class="instruction-hint" id="instructionHint"></div>
        </div>

        <!-- Terminology Tags / Quick reminder -->
        <div class="terms-strip">
            <span class="term-badge multiplicand" data-term="addend" data-i18n="la_term_addend" data-i18n-title="la_term_addend_title" title="Число, которое складываем">Слагаемое</span>
            <span class="term-badge product" data-term="sum" data-i18n="la_term_sum" data-i18n-title="la_term_sum_title" title="Результат сложения">Сумма</span>
            <span class="term-badge partial" data-term="carry" data-i18n="la_term_carry" data-i18n-title="la_term_carry_title" title="Десяток, который переносим в следующий разряд">Перенос</span>
        </div>

        <!-- Math Notebook Grid Board -->
        <div class="board-container">
            <div class="grid-wrapper" id="gridWrapper">
                <div class="math-grid" id="mathGrid">
                    <!-- Dynamically generated squared cells -->
                </div>
                <!-- Decimal separators drawn on cell borders -->
                <div class="comma-layer" id="commaLayer"></div>
            </div>
        </div>

        <!-- Touch Numpad -->
        <div class="numpad-grid" id="numpadGrid" role="group" data-i18n-aria-label="la_numpad_aria" aria-label="Цифровая клавиатура">
            <button type="button" class="numpad-btn" data-key="1">1</button>
            <button type="button" class="numpad-btn" data-key="2">2</button>
            <button type="button" class="numpad-btn" data-key="3">3</button>
            <button type="button" class="numpad-btn" data-key="4">4</button>
            <button type="button" class="numpad-btn" data-key="5">5</button>
            <button type="button" class="numpad-btn" data-key="6">6</button>
            <button type="button" class="numpad-btn" data-key="7">7</button>
            <button type="button" class="numpad-btn" data-key="8">8</button>
            <button type="button" class="numpad-btn" data-key="9">9</button>
            <button type="button" class="numpad-btn" data-key="0">0</button>
        </div>

        <!-- Custom equation CTA -->
        <button type="button" class="custom-eq-btn" id="customEqBtn" data-i18n="la_custom_btn">✏️ Своё выражение</button>
    </main>

    <!-- Custom Equation Modal -->
    <div class="modal-backdrop" id="customModal" role="dialog" aria-modal="true" aria-labelledby="customModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="customModalTitle" data-i18n="la_custom_title">Своё выражение</div>
                <button type="button" class="modal-close-btn" id="customCloseBtn" data-i18n-aria-label="la_custom_close_aria" aria-label="Закрыть окно">&times;</button>
            </div>
            <div class="modal-body">
                <form class="custom-form" id="customForm" novalidate>
                    <div class="custom-field">
                        <label for="customFactor1" data-i18n="la_custom_addend1">Первое слагаемое</label>
                        <input id="customFactor1" name="factor1" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="123">
                    </div>
                    <div class="custom-field">
                        <label for="customFactor2" data-i18n="la_custom_addend2">Второе слагаемое</label>
                        <input id="customFactor2" name="factor2" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="45">
                    </div>
                    <div class="custom-error" id="customError" role="alert"></div>
                    <div class="custom-actions">
                        <button type="submit" class="custom-solve-btn" data-i18n="la_custom_solve">Решить</button>
                        <button type="button" class="custom-cancel-btn" id="customCancelBtn" data-i18n="la_custom_cancel">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Completion Overlay -->
    <div class="completion-overlay" id="completionOverlay" role="dialog" aria-modal="true">
        <div class="completion-icon">🌟</div>
        <div class="completion-title" data-i18n="la_done_title">Отлично решено!</div>
        <div class="completion-equation" id="completionEquation">12 + 8 = 20</div>
        <button type="button" class="completion-next-btn" id="nextProblemBtn" data-i18n="la_done_next">Следующий пример →</button>
    </div>

    <!-- Game Engine -->
    <script>
        class LongAdditionGame {
            #state;
            #elements;
            #config;

            constructor() {
                this.#initConfig();
                this.#initElements();
                this.#initState();
                this.#bindEvents();
                this.#subscribeToLanguageChanges();
                this.#startNewRound();
            }

            // The context the shared column-game functions work on: this page's
            // elements, state and config, plus the methods only this game has.
            #ctx() {
                return {
                    elements: this.#elements,
                    state: this.#state,
                    config: this.#config,
                    hooks: {
                        initConfig: () => this.#initConfig(),
                        initState: () => this.#initState(),
                        beginRound: (problem, isCustom) => this.#beginRound(problem, isCustom),
                        createProblem: (level) => this.#createProblem(level),
                        promptCurrentStep: () => this.#promptCurrentStep(),
                        renderCommas: () => this.#renderCommas(),
                        renderCompletionEquation: () => this.#renderCompletionEquation(),
                        handleCorrectInput: () => this.#handleCorrectInput(),
                        handleWrongInput: () => this.#handleWrongInput(),
                        highlightTerm: (term) => this.#highlightTerm(term),
                        toggleCustomModal: (open) => this.#toggleCustomModal(open),
                        submitCustomProblem: () => this.#submitCustomProblem(),
                    }
                };
            }

            #initConfig() {
                this.#config = {
                    maxLevel: 20,
                    maxResultDigits: 8,
                    // The notebook grid never uses more than this many columns: with
                    // more the cells and digits get too small to read on a phone.
                    maxGridColumns: 12
                };
            }

            #initElements() {
                this.#elements = BrainWarsColumnGame.initElements();
            }

            #initState() {
                this.#state = {
                    level: 1,
                    isCustomRound: false,
                    hadErrorThisRound: false,
                    firstDigits: '12',
                    firstDecimals: 0,
                    secondDigits: '8',
                    secondDecimals: 0,
                    resultDigits: '20',
                    resultDecimals: 0,
                    steps: [],
                    stepIndex: 0,
                    currentInput: '',
                    expectedAnswer: '',
                    gridMatrix: [],
                    numRows: 0,
                    numCols: 0,
                    baseCol: 0,
                    resultRow: 0,
                    activeTargetCells: []
                };
            }

            #bindEvents() {
                // Numpad clicks
                this.#elements.numpadGrid.addEventListener('click', (e) => {
                    const btn = e.target.closest('.numpad-btn');
                    if (!btn) return;
                    this.#handleKeyPress(btn.dataset.key);
                });

                // Physical keyboard support
                window.addEventListener('keydown', (e) => {
                    if (this.#elements.customModal.classList.contains('open')) {
                        if (e.key === 'Escape') this.#toggleCustomModal(false);
                        return;
                    }
                    if (this.#elements.levelMenu.classList.contains('open')) {
                        if (e.key === 'Escape') {
                            this.#toggleLevelMenu(false);
                            this.#elements.levelDisplay.focus();
                        }
                        return;
                    }
                    if (this.#elements.completionOverlay.classList.contains('show')) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            this.#startNewRound();
                        }
                        return;
                    }

                    const isControlFocused = e.target instanceof HTMLElement &&
                        (e.target.tagName === 'BUTTON' || e.target.tagName === 'A');
                    if (isControlFocused && (e.key === 'Enter' || e.key === ' ')) {
                        return; // Let the focused control handle its own activation
                    }

                    if (e.key >= '0' && e.key <= '9') {
                        this.#handleKeyPress(e.key);
                    } else if (e.key === 'Backspace') {
                        this.#handleKeyPress('backspace');
                    } else if (e.key === 'Enter') {
                        this.#handleKeyPress('enter');
                    }
                });

                // Terminology badge interactive highlights
                document.querySelectorAll('.term-badge').forEach(badge => {
                    badge.addEventListener('click', () => {
                        this.#highlightTerm(badge.dataset.term);
                    });
                });

                // Window resize for comma alignment
                window.addEventListener('resize', () => {
                    this.#applyCellSize();
                    this.#renderCommas();
                });


                // Completion next button
                this.#elements.nextProblemBtn.addEventListener('click', () => this.#startNewRound());

                // Custom equation modal
                this.#elements.customEqBtn.addEventListener('click', () => this.#toggleCustomModal(true));
                this.#elements.customCloseBtn.addEventListener('click', () => this.#toggleCustomModal(false));
                this.#elements.customCancelBtn.addEventListener('click', () => this.#toggleCustomModal(false));
                this.#elements.customModal.addEventListener('click', (e) => {
                    if (e.target === this.#elements.customModal) this.#toggleCustomModal(false);
                });
                this.#elements.customForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.#submitCustomProblem();
                });

                // Level picker
                this.#elements.levelDisplay.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.#toggleLevelMenu();
                });
                this.#elements.levelMenu.addEventListener('click', (e) => {
                    const item = e.target.closest('.level-menu-item');
                    if (!item) return;
                    e.stopPropagation();
                    this.#selectLevel(Number(item.dataset.level));
                });
                this.#elements.levelMenu.addEventListener('keydown', (e) => {
                    const items = Array.from(this.#elements.levelMenu.querySelectorAll('.level-menu-item'));
                    const index = items.indexOf(document.activeElement);
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        const next = items[Math.min(items.length - 1, index + 1)];
                        if (next) next.focus();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        const prev = items[Math.max(0, index - 1)];
                        if (prev) prev.focus();
                    } else if (e.key === 'Home') {
                        e.preventDefault();
                        items[0].focus();
                    } else if (e.key === 'End') {
                        e.preventDefault();
                        items[items.length - 1].focus();
                    }
                });
                document.addEventListener('click', (e) => {
                    if (!this.#elements.levelMenu.classList.contains('open')) return;
                    if (e.target.closest('.level-picker')) return;
                    this.#toggleLevelMenu(false);
                });
            }

            #subscribeToLanguageChanges() {
                I18n.subscribe(() => this.#handleLanguageChange());
            }

            #handleLanguageChange() {
                this.#renderLevelBadge();
                if (this.#elements.levelMenu.classList.contains('open')) {
                    this.#renderLevelMenu();
                }
                this.#renderCommas();
                this.#renderCompletionEquation();
                if (!this.#elements.completionOverlay.classList.contains('show')) {
                    this.#promptCurrentStep();
                }
            }

            // ---------------------------------------------------------------
            // Problem generation
            // ---------------------------------------------------------------

            #randomInt(min, max) {
                return BrainWarsColumnGame.randomInt(min, max);
            }

            #randomNumberString(integerDigits, decimals, big) {
                let digits = '';
                for (let i = 0; i < integerDigits; i++) {
                    digits += String(this.#randomInt(big ? 4 : (i === 0 ? 1 : 0), 9));
                }
                for (let i = 0; i < decimals; i++) {
                    const lastFractionDigit = i === decimals - 1;
                    digits += String(this.#randomInt(lastFractionDigit ? 1 : 0, 9));
                }
                return digits;
            }

            #scaledDigits(digits, decimals, scale) {
                return digits + '0'.repeat(scale - decimals);
            }

            #columnSums(firstDigits, firstDecimals, secondDigits, secondDecimals) {
                const scale = Math.max(firstDecimals, secondDecimals);
                const a = this.#scaledDigits(firstDigits, firstDecimals, scale);
                const b = this.#scaledDigits(secondDigits, secondDecimals, scale);
                const length = Math.max(a.length, b.length);
                const sums = [];
                for (let i = 0; i < length; i++) {
                    const aDigit = i < a.length ? Number(a[a.length - 1 - i]) : 0;
                    const bDigit = i < b.length ? Number(b[b.length - 1 - i]) : 0;
                    sums.push(aDigit + bDigit);
                }
                return sums;
            }

            // Difficulty grows with digit counts, then with decimals.
            #getLevelConfig(level) {
                const table = [
                    { iMin: 2, iMax: 2, jMin: 1, jMax: 1, noCarry: true },
                    { iMin: 2, iMax: 2, jMin: 1, jMax: 1, hasCarry: true },
                    { iMin: 2, iMax: 2, jMin: 2, jMax: 2, noCarry: true },
                    { iMin: 2, iMax: 2, jMin: 2, jMax: 2, hasCarry: true },
                    { iMin: 3, iMax: 3, jMin: 2, jMax: 2 },
                    { iMin: 3, iMax: 3, jMin: 3, jMax: 3 },
                    { iMin: 3, iMax: 3, jMin: 3, jMax: 3, bigDigits: true },
                    { iMin: 4, iMax: 4, jMin: 3, jMax: 3 },
                    { iMin: 4, iMax: 4, jMin: 4, jMax: 4 },
                    { iMin: 5, iMax: 5, jMin: 4, jMax: 4, bigDigits: true },
                    { iMin: 2, iMax: 3, jMin: 2, jMax: 3, k1: 1, k2: 1 },
                    { iMin: 2, iMax: 3, jMin: 2, jMax: 3, k1: 1 },
                    { iMin: 2, iMax: 3, jMin: 2, jMax: 3, k1: 1, k2: 2 },
                    { iMin: 2, iMax: 3, jMin: 2, jMax: 3, k1: 2, k2: 1 },
                    { iMin: 2, iMax: 3, jMin: 2, jMax: 3, k1: 2, k2: 2 },
                    { iMin: 3, iMax: 3, jMin: 3, jMax: 3, k1: 1, k2: 2 },
                    { iMin: 3, iMax: 4, jMin: 3, jMax: 3, k1: 2, k2: 2 },
                    { iMin: 4, iMax: 4, jMin: 3, jMax: 4, k1: 2, k2: 1 },
                    { iMin: 4, iMax: 4, jMin: 4, jMax: 4, k1: 2, k2: 2 },
                    { iMin: 4, iMax: 5, jMin: 4, jMax: 4, k1: 2, k2: 2, bigDigits: true }
                ];
                const index = Math.min(Math.max(level, 1), table.length) - 1;
                return table[index];
            }

            #createProblem(level) {
                const cfg = this.#getLevelConfig(level);
                const k1 = cfg.k1 || 0;
                const k2 = cfg.k2 || 0;

                for (let attempt = 0; attempt < 600; attempt++) {
                    const firstIntegerDigits = this.#randomInt(cfg.iMin, cfg.iMax);
                    const secondIntegerDigits = this.#randomInt(cfg.jMin, cfg.jMax);
                    const firstDigits = this.#randomNumberString(firstIntegerDigits, k1, cfg.bigDigits);
                    const secondDigits = this.#randomNumberString(secondIntegerDigits, k2, cfg.bigDigits);

                    const scale = Math.max(k1, k2);
                    const sum = Number(this.#scaledDigits(firstDigits, k1, scale)) +
                        Number(this.#scaledDigits(secondDigits, k2, scale));
                    if (String(sum).length > this.#config.maxResultDigits) continue;

                    const sums = this.#columnSums(firstDigits, k1, secondDigits, k2);
                    const hasCarry = sums.some((value) => value >= 10);
                    if (cfg.noCarry && hasCarry) continue;
                    if (cfg.hasCarry && !hasCarry) continue;

                    // Keep the notebook grid inside the column budget, otherwise the
                    // cells get too small to read on a phone.
                    if (this.#geometry(firstDigits, k1, secondDigits, k2).numCols > this.#config.maxGridColumns) continue;

                    return {
                        firstDigits,
                        firstDecimals: k1,
                        secondDigits,
                        secondDecimals: k2
                    };
                }

                return { firstDigits: '12', firstDecimals: 0, secondDigits: '8', secondDecimals: 0 };
            }

            // ---------------------------------------------------------------
            // Round setup
            // ---------------------------------------------------------------

            #startNewRound() {
                this.#beginRound(this.#createProblem(this.#state.level), false);
            }

            #beginRound(problem, isCustomRound) {
                this.#elements.completionOverlay.classList.remove('show');
                this.#state.isCustomRound = !!isCustomRound;
                this.#state.hadErrorThisRound = false;
                this.#state.currentInput = '';
                this.#state.firstDigits = problem.firstDigits;
                this.#state.firstDecimals = problem.firstDecimals;
                this.#state.secondDigits = problem.secondDigits;
                this.#state.secondDecimals = problem.secondDecimals;

                this.#renderLevelBadge();
                this.#computeGeometry();
                this.#computePlan();
                this.#buildGrid();
                this.#renderCommas();

                this.#state.stepIndex = 0;
                this.#promptCurrentStep();
            }

            // Sign gutter + the widest operand or result + the decimal places. No
            // trailing column is reserved, so the right-most cell always holds a digit.
            #geometry(firstDigits, firstDecimals, secondDigits, secondDecimals) {
                const scale = Math.max(firstDecimals, secondDecimals);
                const firstScaled = this.#scaledDigits(firstDigits, firstDecimals, scale);
                const secondScaled = this.#scaledDigits(secondDigits, secondDecimals, scale);
                const resultDigits = String(Number(firstScaled) + Number(secondScaled));
                const integerColumns = Math.max(
                    firstScaled.length - scale,
                    secondScaled.length - scale,
                    resultDigits.length - scale
                );

                // Column 0 is the single sign/carry gutter: the operands start there.
                return {
                    scale,
                    resultDigits,
                    baseCol: integerColumns,
                    numCols: integerColumns + 1 + scale
                };
            }

            #computeGeometry() {
                const s = this.#state;
                const geometry = this.#geometry(s.firstDigits, s.firstDecimals, s.secondDigits, s.secondDecimals);

                s.resultDecimals = geometry.scale;
                s.resultDigits = geometry.resultDigits;
                s.baseCol = geometry.baseCol;
                s.numCols = geometry.numCols;
                // Operands on rows 0-1 and the result right below the line on row 2.
                s.numRows = 3;
                s.resultRow = 2;
            }

            #computePlan() {
                const s = this.#state;
                const scale = s.resultDecimals;
                const a = this.#scaledDigits(s.firstDigits, s.firstDecimals, scale);
                const b = this.#scaledDigits(s.secondDigits, s.secondDecimals, scale);
                const steps = [];
                let carry = 0;

                for (let c = 0; c < s.resultDigits.length; c++) {
                    const col = s.baseCol - c + scale;
                    const addends = [];
                    if (c < a.length) addends.push(Number(a[a.length - 1 - c]));
                    if (c < b.length) addends.push(Number(b[b.length - 1 - c]));
                    const carryBefore = carry;

                    if (addends.length === 0) {
                        // Only the carry is left
                        steps.push({
                            type: 'CARRY',
                            expected: carryBefore,
                            writeDigit: carryBefore,
                            row: s.resultRow,
                            col,
                            badge: null,
                            carryAfter: 0
                        });
                        carry = 0;
                    } else {
                        const value = addends.reduce((sum, digit) => sum + digit, 0) + carryBefore;
                        const writeDigit = value % 10;
                        carry = Math.floor(value / 10);
                        steps.push({
                            type: 'ADD',
                            addends,
                            carryBefore,
                            expected: value,
                            writeDigit,
                            row: s.resultRow,
                            col,
                            badge: carry > 0 ? { row: 0, col: col - 1 } : null,
                            carryAfter: carry
                        });
                    }
                }

                s.steps = steps;
            }

            // ---------------------------------------------------------------
            // Grid
            // ---------------------------------------------------------------

            #buildGrid() {
                const s = this.#state;
                const scale = s.resultDecimals;
                const firstLength = s.firstDigits.length;
                const secondLength = s.secondDigits.length;
                const firstIntegerColumns = firstLength - s.firstDecimals;
                const secondIntegerColumns = secondLength - s.secondDecimals;

                const matrix = [];
                for (let r = 0; r < s.numRows; r++) {
                    const row = [];
                    for (let c = 0; c < s.numCols; c++) {
                        row.push({ char: '', classes: [] });
                    }
                    matrix.push(row);
                }

                // Operands, placed by place value so the decimal points align
                for (let i = 0; i < firstLength; i++) {
                    matrix[0][s.baseCol - i + s.firstDecimals].char = s.firstDigits[firstLength - 1 - i];
                }
                for (let i = 0; i < secondLength; i++) {
                    matrix[1][s.baseCol - i + s.secondDecimals].char = s.secondDigits[secondLength - 1 - i];
                }
                matrix[1][s.baseCol - secondIntegerColumns].char = '+';
                matrix[1][s.baseCol - secondIntegerColumns].classes.push('operator-sign');

                // Line under the operands
                const leftmost = s.baseCol - Math.max(firstIntegerColumns, secondIntegerColumns) + 1;
                for (let c = leftmost; c <= s.baseCol + scale; c++) {
                    matrix[1][c].classes.push('subtraction-line');
                }

                s.gridMatrix = matrix;
                this.#renderGridDOM();
            }

            #renderGridDOM() {
                const grid = this.#elements.mathGrid;
                grid.innerHTML = '';

                this.#applyCellSize();

                grid.style.gridTemplateColumns = `repeat(${this.#state.numCols}, var(--cell-size))`;
                grid.style.gridTemplateRows = `repeat(${this.#state.numRows}, var(--cell-size))`;

                for (let r = 0; r < this.#state.numRows; r++) {
                    for (let c = 0; c < this.#state.numCols; c++) {
                        const cellData = this.#state.gridMatrix[r][c];
                        const cellEl = document.createElement('div');
                        cellEl.className = 'grid-cell ' + cellData.classes.join(' ');
                        cellEl.id = `cell-${r}-${c}`;
                        cellEl.textContent = cellData.char;
                        grid.appendChild(cellEl);
                    }
                }
            }

            // The notebook grid is the main content, so cells grow to fill the free
            // width. They only shrink (down to a readable floor) when a long problem
            // needs more columns than fit on screen.
            #applyCellSize() {
                BrainWarsColumnGame.applyCellSize(this.#elements, this.#state);
            }

            // All decimal separators sit on the same boundary (decimal points
            // are aligned), so one boundary per row with decimals is enough.
            #renderCommas() {
                const layer = this.#elements.commaLayer;
                layer.innerHTML = '';

                const grid = this.#elements.mathGrid;
                const gridRect = grid.getBoundingClientRect();
                const separator = I18n.t('decimal_separator');

                const place = (row, decimals) => {
                    if (!decimals) return;
                    const cell = document.getElementById(`cell-${row}-${this.#state.baseCol}`);
                    if (!cell) return;
                    const rect = cell.getBoundingClientRect();
                    const span = document.createElement('span');
                    span.className = 'comma-overlay';
                    span.textContent = separator;
                    span.style.left = (rect.left - gridRect.left) + 'px';
                    span.style.top = (rect.top - gridRect.top) + 'px';
                    span.style.height = rect.height + 'px';
                    layer.appendChild(span);
                };

                place(0, this.#state.firstDecimals);
                place(1, this.#state.secondDecimals);
                place(this.#state.resultRow, this.#state.resultDecimals);
            }

            // ---------------------------------------------------------------
            // Prompting and input
            // ---------------------------------------------------------------

            #promptCurrentStep() {
                // Steps with nothing to compute are filled in automatically
                const step = this.#state.steps[this.#state.stepIndex];
                if (!step) {
                    this.#finishRound();
                    return;
                }

                this.#state.currentInput = '';
                this.#state.expectedAnswer = String(step.expected);
                this.#elements.instructionHint.classList.remove('is-error');
                this.#syncActiveCell();

                if (step.type === 'ADD') {
                    const expression = step.addends.join(' + ') +
                        (step.carryBefore > 0 ? ' + ' + step.carryBefore : '');
                    this.#elements.instructionHint.textContent = I18n.t('la_add_hint', { expr: expression });
                } else {
                    this.#elements.instructionHint.textContent = I18n.t('la_carry_hint', { carry: step.expected });
                }
            }

            #writeStep(step) {
                this.#setCellValue(step.row, step.col, String(step.writeDigit), ['correct-flash']);
                this.#clearCarryBadges();
                if (step.badge) {
                    this.#setCarryBadge(step.badge.row, step.badge.col, step.carryAfter);
                }
            }

            #syncActiveCell() {
                const step = this.#state.steps[this.#state.stepIndex];
                const previous = this.#state.activeTargetCells;
                previous.forEach(({ r, c }) => {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (cell) {
                        cell.classList.remove('active-input', 'typing-preview', 'multi');
                        cell.textContent = this.#state.gridMatrix[r][c].char;
                    }
                });

                this.#state.activeTargetCells = [{ r: step.row, c: step.col }];
                const cell = document.getElementById(`cell-${step.row}-${step.col}`);
                if (cell) {
                    cell.classList.add('active-input');
                    this.#scrollCellIntoView(cell);
                }
            }

            #scrollCellIntoView(cell) {
                BrainWarsColumnGame.scrollCellIntoView(cell, this.#elements);
            }

            #handleKeyPress(key) {
                if (key === 'backspace') {
                    this.#state.currentInput = this.#state.currentInput.slice(0, -1);
                    this.#renderTypingPreview();
                    return;
                }

                if (key === 'enter') {
                    this.#submitCurrentInput();
                    return;
                }

                if (key >= '0' && key <= '9') {
                    if (this.#state.currentInput.length >= this.#state.expectedAnswer.length) return;
                    this.#elements.instructionHint.classList.remove('is-error');
                    this.#state.currentInput += key;
                    this.#renderTypingPreview();

                    if (this.#state.currentInput.length === this.#state.expectedAnswer.length) {
                        setTimeout(() => this.#submitCurrentInput(), 80);
                    }
                }
            }

            #renderTypingPreview() {
                BrainWarsColumnGame.renderTypingPreview(this.#state);
            }

            #submitCurrentInput() {
                const userVal = this.#state.currentInput.trim();
                if (!userVal) return;

                if (userVal === this.#state.expectedAnswer) {
                    this.#handleCorrectInput();
                } else {
                    this.#handleWrongInput();
                }
            }

            #handleCorrectInput() {
                const step = this.#state.steps[this.#state.stepIndex];

                this.#writeStep(step);
                this.#state.stepIndex++;
                this.#promptCurrentStep();
            }

            #handleWrongInput() {
                this.#state.hadErrorThisRound = true;

                this.#state.activeTargetCells.forEach(({ r, c }) => {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (!cell) return;
                    cell.classList.add('error-shake');
                    setTimeout(() => cell.classList.remove('error-shake'), 600);
                });

                this.#elements.instructionHint.classList.add('is-error');
                this.#elements.instructionHint.textContent = I18n.t('la_wrong_hint');

                setTimeout(() => {
                    this.#elements.instructionHint.classList.remove('is-error');
                }, 1200);

                this.#state.currentInput = '';
                this.#renderTypingPreview();
            }

            #setCellValue(r, c, char, additionalClasses = []) {
                BrainWarsColumnGame.setCellValue(r, c, char, additionalClasses, this.#state);
            }

            #setCarryBadge(r, c, value) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                if (!cell) return;
                const badge = document.createElement('span');
                badge.className = 'carry-badge';
                badge.textContent = '+' + value;
                cell.appendChild(badge);
            }

            #clearCarryBadges() {
                document.querySelectorAll('.carry-badge').forEach(badge => badge.remove());
            }

            // ---------------------------------------------------------------
            // Terminology highlights
            // ---------------------------------------------------------------

            // Paint every element `collect` returns, then drop the paint again.
            #paint(cls, collect) {
                BrainWarsColumnGame.paint(cls, collect);
            }

            #addendCells() {
                const cells = [];
                [this.#state.firstDigits, this.#state.secondDigits].forEach((digits, row) => {
                    const decimals = row === 0 ? this.#state.firstDecimals : this.#state.secondDecimals;
                    for (let i = 0; i < digits.length; i++) {
                        cells.push(document.getElementById(`cell-${row}-${this.#state.baseCol - i + decimals}`));
                    }
                });
                return cells.filter(Boolean);
            }

            #sumCells() {
                const cells = [];
                for (let c = 0; c < this.#state.resultDigits.length; c++) {
                    const cell = document.getElementById(`cell-${this.#state.resultRow}-${this.#state.baseCol - c + this.#state.resultDecimals}`);
                    if (cell && cell.textContent) cells.push(cell);
                }
                return cells;
            }

            #carryCells() {
                const badge = document.querySelector('.carry-badge');
                const step = this.#state.steps[Math.min(this.#state.stepIndex, this.#state.steps.length - 1)];
                const target = badge ? badge.parentElement : (step ? document.getElementById(`cell-0-${step.col - 1}`) : null);
                return target ? [target] : [];
            }

            #highlightTerm(term) {
                if (term === 'addend') return this.#paint('term-highlight-blue', () => this.#addendCells());
                if (term === 'sum') return this.#paint('term-highlight-green', () => this.#sumCells());
                if (term === 'carry') return this.#paint('term-highlight-purple', () => this.#carryCells());
            }

            // ---------------------------------------------------------------
            // Round completion
            // ---------------------------------------------------------------

            #formatNumberText(digits, decimals) {
                return BrainWarsColumnGame.formatNumberText(digits, decimals);
            }

            #renderCompletionEquation() {
                this.#elements.completionEquation.textContent =
                    `${this.#formatNumberText(this.#state.firstDigits, this.#state.firstDecimals)}` +
                    ` + ${this.#formatNumberText(this.#state.secondDigits, this.#state.secondDecimals)}` +
                    ` = ${this.#formatNumberText(this.#state.resultDigits, this.#state.resultDecimals)}`;
            }

            #finishRound() {
                this.#state.activeTargetCells = [];
                this.#clearCarryBadges();

                // Custom equations don't affect the level progression
                if (!this.#state.isCustomRound) {
                    if (this.#state.hadErrorThisRound) {
                        this.#state.level = Math.max(1, this.#state.level - 1);
                    } else {
                        this.#state.level = Math.min(this.#config.maxLevel, this.#state.level + 1);
                    }
                }

                this.#renderCompletionEquation();

                setTimeout(() => {
                    this.#elements.completionOverlay.classList.add('show');
                }, 400);
            }

            // ---------------------------------------------------------------
            // Level picker
            // ---------------------------------------------------------------

            #renderLevelBadge() {
                BrainWarsColumnGame.renderLevelBadge(this.#elements, this.#state);
            }

            #renderLevelMenu() {
                BrainWarsColumnGame.renderLevelMenu(this.#elements, this.#state, this.#config);
            }

            #toggleLevelMenu(open) {
                const menu = this.#elements.levelMenu;
                const willOpen = (open !== undefined) ? open : !menu.classList.contains('open');
                menu.classList.toggle('open', willOpen);
                this.#elements.levelDisplay.setAttribute('aria-expanded', willOpen ? 'true' : 'false');

                if (willOpen) {
                    this.#renderLevelMenu();
                    this.#positionLevelMenu();
                    const current = menu.querySelector('.level-menu-item.current');
                    if (current) current.focus();
                }
            }

            #positionLevelMenu() {
                BrainWarsColumnGame.positionLevelMenu(this.#elements);
            }

            #selectLevel(level) {
                this.#state.level = Math.min(Math.max(level, 1), this.#config.maxLevel);
                this.#toggleLevelMenu(false);
                this.#startNewRound();
            }

            // ---------------------------------------------------------------
            // Modals
            // ---------------------------------------------------------------


            #toggleCustomModal(open) {
                this.#elements.customModal.classList.toggle('open', open);
                this.#elements.customError.textContent = '';
                if (open) {
                    this.#elements.customFactor1.value =
                        this.#formatNumberText(this.#state.firstDigits, this.#state.firstDecimals);
                    this.#elements.customFactor2.value =
                        this.#formatNumberText(this.#state.secondDigits, this.#state.secondDecimals);
                    this.#elements.customFactor1.focus();
                    this.#elements.customFactor1.select();
                }
            }

            #showCustomError(key) {
                BrainWarsColumnGame.showCustomError(key, this.#elements);
            }

            #parseAddend(raw) {
                // Accept generous input here: the result and column budgets below
                // decide what can be shown, and they report their own "too big" message.
                const match = String(raw).trim().replace(/\s+/g, '').match(/^(\d{1,12})(?:[.,](\d{1,2}))?$/);
                if (!match || Number(match[1]) < 1) return null;
                let fraction = match[2] || '';
                while (fraction.endsWith('0')) fraction = fraction.slice(0, -1);
                return { digits: match[1] + fraction, decimals: fraction.length };
            }

            #submitCustomProblem() {
                const first = this.#parseAddend(this.#elements.customFactor1.value);
                const second = this.#parseAddend(this.#elements.customFactor2.value);
                if (!first || !second) {
                    this.#showCustomError('la_custom_err_addend');
                    return;
                }

                const scale = Math.max(first.decimals, second.decimals);
                const sum = Number(this.#scaledDigits(first.digits, first.decimals, scale)) +
                    Number(this.#scaledDigits(second.digits, second.decimals, scale));
                if (String(sum).length > this.#config.maxResultDigits) {
                    this.#showCustomError('la_custom_err_too_big');
                    return;
                }

                // Same column budget as the generated levels: a longer example would
                // shrink the grid cells until the digits are unreadable.
                if (this.#geometry(first.digits, first.decimals, second.digits, second.decimals).numCols > this.#config.maxGridColumns) {
                    this.#showCustomError('la_custom_err_too_big');
                    return;
                }

                this.#toggleCustomModal(false);
                this.#beginRound({
                    firstDigits: first.digits,
                    firstDecimals: first.decimals,
                    secondDigits: second.digits,
                    secondDecimals: second.decimals
                }, true);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new LongAdditionGame();
        });

    </script>
</body>
</html>
