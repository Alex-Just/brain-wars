<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#f5f5f5">
    <link rel="icon" type="image/png" href="./icons/icon-32.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brain Wars">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="pwa.js" defer></script>
    <style>
        /* Boot loader: painted before the deferred scripts run, faded out when the page is ready */
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            transition: opacity 0.25s ease;
        }
        #boot-loader.is-done {
            opacity: 0;
            pointer-events: none;
        }
        #boot-loader::after {
            content: '';
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(0, 0, 0, 0.12);
            border-top-color: #4d8a98;
            animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-loader::after { animation-duration: 2.4s; }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('boot-loader');
            if (!loader) return;
            loader.classList.add('is-done');
            setTimeout(() => loader.remove(), 400);
        });
    </script>
    <title>Сложение в столбик</title>
    <script src="i18n.js" defer></script>
    <script src="games.js" defer></script>
    <script src="analytics.js" defer></script>
    <script src="column-game.js" defer></script>
  <script src="challenge.js" defer></script>
  <link rel="stylesheet" href="./column-game.css">
</head>
<body>
    <div id="boot-loader" aria-hidden="true"></div>

    <!-- Top Navigation -->
    <header class="top-nav">
        <a id="backBtn" class="nav-btn icon-btn" href="./index.html" data-i18n-aria-label="nav_back" aria-label="Назад к играм"><svg class="back-arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M20 12H6M11.5 6 5.5 12 11.5 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <div data-lang-toggle></div>
        <div class="level-picker">
            <button type="button" id="levelDisplay" class="level-badge" aria-haspopup="listbox" aria-expanded="false">
                <span id="levelText" aria-live="polite">Уровень 1</span>
                <span class="level-caret" aria-hidden="true">▾</span>
            </button>
            <div class="level-menu" id="levelMenu" role="listbox" data-i18n-aria-label="la_level_menu_aria" aria-label="Выберите уровень"></div>
        </div>
    </header>

    <!-- Main Game Card -->
    <main class="game-card">
        <!-- Step instruction banner -->
        <div class="instruction-box" id="instructionBox" role="status" aria-live="polite">
            <div class="instruction-hint" id="instructionHint"></div>
        </div>

        <!-- Terminology Tags / Quick reminder -->
        <div class="terms-strip">
            <span class="term-badge multiplicand" data-term="addend" data-i18n="la_term_addend" data-i18n-title="la_term_addend_title" title="Число, которое складываем">Слагаемое</span>
            <span class="term-badge product" data-term="sum" data-i18n="la_term_sum" data-i18n-title="la_term_sum_title" title="Результат сложения">Сумма</span>
            <span class="term-badge partial" data-term="carry" data-i18n="la_term_carry" data-i18n-title="la_term_carry_title" title="Десяток, который переносим в следующий разряд">Перенос</span>
        </div>

        <!-- Math Notebook Grid Board -->
        <div class="board-container">
            <div class="grid-wrapper" id="gridWrapper">
                <div class="math-grid" id="mathGrid">
                    <!-- Dynamically generated squared cells -->
                </div>
                <!-- Decimal separators drawn on cell borders -->
                <div class="comma-layer" id="commaLayer"></div>
            </div>
        </div>

        <!-- Touch Numpad -->
        <div class="numpad-grid" id="numpadGrid" role="group" data-i18n-aria-label="la_numpad_aria" aria-label="Цифровая клавиатура">
            <button type="button" class="numpad-btn" data-key="1">1</button>
            <button type="button" class="numpad-btn" data-key="2">2</button>
            <button type="button" class="numpad-btn" data-key="3">3</button>
            <button type="button" class="numpad-btn" data-key="4">4</button>
            <button type="button" class="numpad-btn" data-key="5">5</button>
            <button type="button" class="numpad-btn" data-key="6">6</button>
            <button type="button" class="numpad-btn" data-key="7">7</button>
            <button type="button" class="numpad-btn" data-key="8">8</button>
            <button type="button" class="numpad-btn" data-key="9">9</button>
            <button type="button" class="numpad-btn" data-key="0">0</button>
        </div>

        <!-- Custom equation CTA -->
        <button type="button" class="custom-eq-btn" id="customEqBtn" data-i18n="la_custom_btn">✏️ Своё выражение</button>
    </main>

    <!-- Custom Equation Modal -->
    <div class="modal-backdrop" id="customModal" role="dialog" aria-modal="true" aria-labelledby="customModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="customModalTitle" data-i18n="la_custom_title">Своё выражение</div>
                <button type="button" class="modal-close-btn" id="customCloseBtn" data-i18n-aria-label="la_custom_close_aria" aria-label="Закрыть окно">&times;</button>
            </div>
            <div class="modal-body">
                <form class="custom-form" id="customForm" novalidate>
                    <div class="custom-field">
                        <label for="customFactor1" data-i18n="la_custom_addend1">Первое слагаемое</label>
                        <input id="customFactor1" name="factor1" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="123">
                    </div>
                    <div class="custom-field">
                        <label for="customFactor2" data-i18n="la_custom_addend2">Второе слагаемое</label>
                        <input id="customFactor2" name="factor2" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="45">
                    </div>
                    <div class="custom-error" id="customError" role="alert"></div>
                    <div class="custom-actions">
                        <button type="submit" class="custom-solve-btn" data-i18n="la_custom_solve">Решить</button>
                        <button type="button" class="custom-cancel-btn" id="customCancelBtn" data-i18n="la_custom_cancel">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Completion Overlay -->
    <div class="completion-overlay" id="completionOverlay" role="dialog" aria-modal="true">
        <div class="completion-icon">🌟</div>
        <div class="completion-title" data-i18n="la_done_title">Отлично решено!</div>
        <div class="completion-equation" id="completionEquation">12 + 8 = 20</div>
        <button type="button" class="completion-next-btn" id="nextProblemBtn" data-i18n="la_done_next">Следующий пример →</button>
    </div>

    <!-- Game Engine -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            class LongAdditionGame extends BrainWarsColumnGame.ColumnGame {
                constructor() {
                    super({
                        operator: '+',
                        keys: { wrongHint: 'la_wrong_hint' }
                    });
                }

            }
            new LongAdditionGame();
        });

    </script>
</body>
</html>
