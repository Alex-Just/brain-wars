    <style>
        /* Boot loader: painted before the deferred scripts run, faded out when the page is ready */
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            transition: opacity 0.25s ease;
        }
        #boot-loader.is-done {
            opacity: 0;
            pointer-events: none;
        }
        #boot-loader::after {
            content: '';
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(0, 0, 0, 0.12);
            border-top-color: #4d8a98;
            animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-loader::after { animation-duration: 2.4s; }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('boot-loader');
            if (!loader) return;
            loader.classList.add('is-done');
            setTimeout(() => loader.remove(), 400);
        });
    </script>
  <title>Повтори наоборот</title>
