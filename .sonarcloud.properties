# SonarQube Cloud Automatic Analysis reads this file from the repository's
# default branch. It is not the same as sonar-project.properties, which is only
# used for CI-based analysis.
#
# The files below are excluded from duplication (copy/paste) detection only.
# They are still analysed for issues; only the duplication engine skips them.
#
# i18n.js is a translation table: one key with its English, Spanish and Russian
# text per row. Sonar's JavaScript duplication ignores literal values, so the
# uniform, highly structured rows are reported as one very long repeated block
# even though every row holds different text.
#
# The game pages are self-contained static HTML files. The site is published by
# GitHub Pages with no build or templating step, so every page has to restate
# the shared page shell (head, styles, completion modal) rather than factor it
# out. Duplication between the pages is expected by design and cannot be removed
# without introducing a build step.
sonar.cpd.exclusions=i18n.js,challenge.html,elapsed-time.html,follow-the-leader.html,index.html,long-addition.html,long-division.html,long-multiplication.html,long-subtraction.html,money-calculations.html,money-problems.html,operations.html,telling-time-es.html,time-calculations.html,unfollow-the-leader.html,unit-conversions.html
