config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "biome"

[[plugin]]
name = "markdownlint"

# This README and the design docs use long prose lines. Keep the other
# Markdown rules, but never fail a push on line length.
[[triage]]
match.rules = ["markdownlint:MD013"]
set.ignored = true

# The README opens with a centred logo and uses inline HTML for its badges.
# Both are deliberate, so the Markdown HTML rules stay off.
[[triage]]
match.rules = ["markdownlint:MD033", "markdownlint:MD041"]
set.ignored = true

# This project ships classic <script> files and CommonJS test files. Both are
# sloppy mode by default, so the "use strict" directives are load-bearing.
# Biome parses the files as modules and reports them as redundant.
[[triage]]
match.rules = ["biome:lint/suspicious/noRedundantUseStrict"]
set.ignored = true

# The shared game stylesheets keep two deliberate patterns that biome reads as
# mistakes: a vh fallback before each svh/dvh (older browsers) and !important on
# the state colours that have to beat the hover rules.
[[triage]]
match.rules = ["biome:lint/suspicious/noDuplicateProperties", "biome:lint/complexity/noImportantStyles"]
match.file_patterns = ["memory-game.css", "column-game.css"]
set.ignored = true
